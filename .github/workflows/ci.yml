name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup

      - name: Prettier
        run: pnpm format:check
      - name: ESLint
        run: pnpm lint
      - name: Steiger (FSD boundaries)
        run: pnpm lint:fsd
      - name: Typecheck
        run: pnpm typecheck
      - name: Claude Code hook tests
        run: pnpm test:hooks

  # Single required status check for branch protection; add every job to `needs`.
  ci-ok:
    name: CI OK
    if: always()
    needs: [quality]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Fail if any job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo "All CI jobs passed."
