name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup

      - name: Prettier
        run: pnpm format:check
      - name: ESLint
        run: pnpm lint
      - name: Steiger (FSD boundaries)
        run: pnpm lint:fsd
      - name: Typecheck
        run: pnpm typecheck
      - name: Claude Code hook tests
        run: pnpm test:hooks

  test:
    name: Unit tests & coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup

      - name: Vitest with coverage thresholds
        run: pnpm test:coverage
      # Fork PRs get a read-only token, so the comment only runs for branches of this repository.
      - name: Coverage report comment
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: davelosert/vitest-coverage-report-action@8f86cfb56ed6d5613ea8cdc5259f207fbfd51ece # v2.13.1
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup

      # Production builds require an explicit stream URL; this artifact is for the e2e and
      # Lighthouse jobs, which start the mock server on localhost:8787.
      - name: Vite production build
        run: pnpm build
        env:
          VITE_STREAM_URL: ws://localhost:8787/ws
      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: apps/web/dist/
          retention-days: 7

  e2e:
    name: E2E (Playwright)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup

      - name: Download build
        uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: apps/web/dist/
      - uses: ./.github/actions/playwright

      - name: Run Playwright against the production build and the mock server
        run: pnpm test:e2e
      # Also after a green run: retried (flaky) tests leave their traces in the report.
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 3

  # lighthouserc.json: the build behind `vite preview` (with its CSP) and the mock server at a low
  # rate, so a live stream does not make the timings noisy. Accessibility fails the job, the rest warns.
  lighthouse:
    name: Lighthouse CI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup

      - name: Download build
        uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: apps/web/dist/
      - name: Collect, assert and upload to temporary public storage
        run: pnpm lhci
      - name: Link the reports in the job summary
        if: ${{ !cancelled() }}
        run: |
          if [ -f .lighthouseci/links.json ]; then
            {
              echo '### Lighthouse reports'
              node -e 'for (const [url, report] of Object.entries(require("./.lighthouseci/links.json"))) console.log(`- [${url}](${report})`)'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload Lighthouse results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse
          path: .lighthouseci/
          include-hidden-files: true
          retention-days: 14

  # The image that deploy.yml ships to Fly.io, started with its production defaults
  # (NODE_ENV=production: the Origin must be allowed, a missing one is rejected).
  server-image:
    name: Server image (Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup

      - name: Build the mock server image
        run: docker build -f apps/mock-server/Dockerfile --build-arg GIT_SHA="$GITHUB_SHA" -t lsv-mock .
      - name: Start the container
        run: docker run -d --name lsv-mock -p 8080:8080 -e ALLOWED_ORIGINS=http://localhost:4173 lsv-mock
      - name: Wait for /healthz
        run: >-
          curl --fail --silent --show-error --retry 30 --retry-delay 1
          --retry-connrefused --retry-all-errors http://localhost:8080/healthz
      - name: WebSocket smoke test against the container
        run: >-
          node scripts/smoke-ws.ts ws://localhost:8080/ws
          --origin http://localhost:4173
          --expect-version "$GITHUB_SHA"
      - name: Container logs
        if: failure()
        run: docker logs lsv-mock

  # Single required status check for branch protection; add every job to `needs`.
  ci-ok:
    name: CI OK
    if: always()
    needs: [quality, test, build, e2e, lighthouse, server-image]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Fail if any job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo "All CI jobs passed."
