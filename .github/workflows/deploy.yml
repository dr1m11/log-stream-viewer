name: Deploy

# Order (docs/adr/0003): the mock server first, then the web app, so a client never ships before a
# server that speaks its protocol. Runs next to CI on main; the ruleset only lets PRs with a green
# CI reach main.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force-server:
        description: Deploy the mock server even if none of its files changed
        type: boolean
        default: false

permissions:
  contents: read

# One deploy per ref at a time; a newer push waits instead of cancelling a deploy halfway. GitHub
# keeps only the newest pending run, which is safe because `changes` diffs against production.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      server: ${{ steps.filter.outputs.server }}
    steps:
      # Full history: the diff below starts at whatever commit production runs, not at this push.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      # Compared with the deployed commit (/healthz `version`), so a server change is not lost when
      # its own run was cancelled while pending or failed and the next push touches other files.
      # An unreachable server or an unknown version means "deploy".
      - name: Compare with the deployed commit
        id: filter
        run: |
          deployed="$(curl --fail --silent --show-error --max-time 10 --retry 3 --retry-all-errors \
            https://log-stream-viewer-mock.fly.dev/healthz | jq -r '.version // empty' || true)"
          echo "Deployed version: ${deployed:-unknown}"
          server=true
          if [[ "$deployed" =~ ^[0-9a-f]{40}$ ]] && git cat-file -e "$deployed^{commit}" 2>/dev/null &&
            git diff --quiet "$deployed" HEAD -- apps/mock-server packages/protocol pnpm-lock.yaml \
              pnpm-workspace.yaml package.json .dockerignore scripts/smoke-ws.ts \
              .github/workflows/deploy.yml >/dev/null; then
            server=false
          fi
          echo "server=$server" | tee -a "$GITHUB_OUTPUT"

  server:
    name: Mock server (Fly.io)
    needs: changes
    # Production runs main only, also when dispatched by hand.
    if: >-
      github.ref == 'refs/heads/main' &&
      (needs.changes.outputs.server == 'true' || inputs.force-server)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: mock-server
      url: https://log-stream-viewer-mock.fly.dev/healthz
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6

      # The repository root is the build context (see the root .dockerignore); one machine, no
      # standby (--ha=false). GIT_SHA becomes /healthz `version`.
      - name: Deploy to Fly.io
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: >-
          flyctl deploy .
          --config apps/mock-server/fly.toml
          --dockerfile apps/mock-server/Dockerfile
          --remote-only
          --ha=false
          --build-arg GIT_SHA="$GITHUB_SHA"

      - uses: ./.github/actions/setup
      # Through Fly's proxy with the production client's Origin: /healthz reports this commit, the
      # stream sends hello and a batch. Retries for 30 s while the machine starts or resumes.
      - name: Smoke-test the stream
        run: >-
          node scripts/smoke-ws.ts wss://log-stream-viewer-mock.fly.dev/ws
          --origin https://log-stream-viewer.marat-gabdrashitov17.workers.dev
          --expect-version "$GITHUB_SHA"

  # PR6 adds the web app's jobs here. `production` must run after `server`, also when `server` was
  # skipped, but never after a failed server deploy:
  #   needs: [changes, server]
  #   if: ${{ !cancelled() && !failure() && github.ref == 'refs/heads/main' }}
  # `preview` (pull_request events) connects to the production mock server.
