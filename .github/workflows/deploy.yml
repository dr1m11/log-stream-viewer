name: Deploy

# Order (docs/adr/0003): the mock server first, then the web app, so a client never ships before a
# server that speaks its protocol. Runs next to CI on main; the ruleset only lets PRs with a green
# CI reach main.
on:
  push:
    branches: [main]
  # Preview versions of the web app (job `preview`); nothing deploys to production from a PR.
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      force-server:
        description: Deploy the mock server even if none of its files changed
        type: boolean
        default: false

permissions:
  contents: read

env:
  WEB_URL: https://log-stream-viewer.marat-gabdrashitov17.workers.dev
  # Production and every preview connect to the production mock server.
  STREAM_URL: wss://log-stream-viewer-mock.fly.dev/ws

# One deploy per ref at a time; a newer push waits instead of cancelling a deploy halfway. GitHub
# keeps only the newest pending run, which is safe because `changes` diffs against production.
# A newer push to a PR replaces its running preview upload.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect changes
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      server: ${{ steps.filter.outputs.server }}
    steps:
      # Full history: the diff below starts at whatever commit production runs, not at this push.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      # Compared with the deployed commit (/healthz `version`), so a server change is not lost when
      # its own run was cancelled while pending or failed and the next push touches other files.
      # An unreachable server or an unknown version means "deploy".
      - name: Compare with the deployed commit
        id: filter
        run: |
          deployed="$(curl --fail --silent --show-error --max-time 10 --retry 3 --retry-all-errors \
            https://log-stream-viewer-mock.fly.dev/healthz | jq -r '.version // empty' || true)"
          echo "Deployed version: ${deployed:-unknown}"
          server=true
          if [[ "$deployed" =~ ^[0-9a-f]{40}$ ]] && git cat-file -e "$deployed^{commit}" 2>/dev/null &&
            git diff --quiet "$deployed" HEAD -- apps/mock-server packages/protocol pnpm-lock.yaml \
              pnpm-workspace.yaml package.json .dockerignore scripts/smoke-ws.ts \
              .github/workflows/deploy.yml >/dev/null; then
            server=false
          fi
          echo "server=$server" | tee -a "$GITHUB_OUTPUT"

  server:
    name: Mock server (Fly.io)
    needs: changes
    # Production runs main only, also when dispatched by hand.
    if: >-
      github.ref == 'refs/heads/main' &&
      (needs.changes.outputs.server == 'true' || inputs.force-server)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: mock-server
      url: https://log-stream-viewer-mock.fly.dev/healthz
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6

      # The repository root is the build context (see the root .dockerignore); one machine, no
      # standby (--ha=false). GIT_SHA becomes /healthz `version`.
      - name: Deploy to Fly.io
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: >-
          flyctl deploy .
          --config apps/mock-server/fly.toml
          --dockerfile apps/mock-server/Dockerfile
          --remote-only
          --ha=false
          --build-arg GIT_SHA="$GITHUB_SHA"

      - uses: ./.github/actions/setup
      # Through Fly's proxy with the production client's Origin: /healthz reports this commit, the
      # stream sends hello and a batch. Retries for 30 s while the machine starts or resumes.
      - name: Smoke-test the stream
        run: >-
          node scripts/smoke-ws.ts "$STREAM_URL"
          --origin "$WEB_URL"
          --expect-version "$GITHUB_SHA"

  # After the server, also when it was skipped (nothing changed), but never after a failed server
  # deploy: a client must not ship before a server that speaks its protocol.
  production:
    name: Web app (Cloudflare Workers)
    needs: [changes, server]
    if: >-
      ${{ !cancelled() && !failure() &&
      github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: web
      url: ${{ env.WEB_URL }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup

      - name: Build
        run: pnpm build
        env:
          VITE_STREAM_URL: ${{ env.STREAM_URL }}
      - name: Deploy to Cloudflare Workers
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy --message "main@${GITHUB_SHA::7}"

      # A deep link goes through the SPA fallback: it must return the app with status 200 and the
      # CSP this build generated (dist/_headers).
      - name: Smoke-check a deep link
        run: |
          expected="$(sed -n 's/^  Content-Security-Policy: //p' apps/web/dist/_headers)"
          status="$(curl --silent --show-error --retry 5 --retry-delay 3 --retry-all-errors \
            --dump-header "$RUNNER_TEMP/headers.txt" --output "$RUNNER_TEMP/body.html" \
            --write-out '%{http_code}' "$WEB_URL/streams/smoke?deep=link")"
          served="$(tr -d '\r' < "$RUNNER_TEMP/headers.txt" |
            sed -n 's/^content-security-policy: //Ip' | tail -n 1)"
          echo "Status: $status"
          echo "CSP: $served"
          [[ "$status" == 200 ]] || { echo "::error::The deep link returned $status"; exit 1; }
          [[ -n "$expected" && "$served" == "$expected" ]] ||
            { echo "::error::The CSP differs from dist/_headers: $expected"; exit 1; }
          grep -q '<div id="root">' "$RUNNER_TEMP/body.html" ||
            { echo "::error::The deep link did not return the app"; exit 1; }

      # The e2e smoke spec against production and its mock server: "Connected", a growing counter,
      # no console errors (CSP violations included), no axe violations.
      - uses: ./.github/actions/playwright
      - name: Playwright smoke test against production
        run: pnpm test:e2e
        env:
          E2E_BASE_URL: ${{ env.WEB_URL }}
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-production
          path: apps/web/playwright-report/
          retention-days: 7

  # Same-repository PRs only (fork PRs get no secrets); Renovate PRs skip previews to save noise.
  # Previews connect to the production mock server, which allows the pr-<number> origins.
  preview:
    name: Web preview
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'renovate[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup

      - name: Build
        run: pnpm build
        env:
          VITE_STREAM_URL: ${{ env.STREAM_URL }}
      - name: Upload a preview version
        id: upload
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.ndjson
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          pnpm exec wrangler versions upload \
            --preview-alias "pr-${PR_NUMBER}" \
            --message "PR #${PR_NUMBER} @ ${HEAD_SHA::7}"
          url="$(jq -r 'select(.type == "version-upload") | .preview_alias_url // .preview_url // empty' \
            "$WRANGLER_OUTPUT_FILE_PATH" | tail -n 1)"
          if [[ -z "$url" ]]; then
            echo "::error::wrangler did not report a preview URL"
            exit 1
          fi
          echo "url=$url" | tee -a "$GITHUB_OUTPUT"
      - name: Smoke-check a deep link
        env:
          PREVIEW_URL: ${{ steps.upload.outputs.url }}
        run: >-
          curl --fail --silent --show-error --retry 5 --retry-delay 3 --retry-all-errors
          --output /dev/null "$PREVIEW_URL/streams/smoke?deep=link"
      - name: Comment the preview URL
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: preview
          message: |
            **Preview:** ${{ steps.upload.outputs.url }}

            Built from ${{ github.event.pull_request.head.sha }}; updates on every push to this PR.
            It connects to the **production mock server** (`${{ env.STREAM_URL }}`), so server or
            protocol changes in this PR are not live there until they merge.
