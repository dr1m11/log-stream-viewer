name: Task / feature
description: A unit of planned work or a feature idea
labels: ['type:feature']
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What should be possible after this is done, and why?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Key changes, affected packages and files.
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: |
        - [ ] ...
    validations:
      required: true
