name: Bug report
description: Something does not work as expected
labels: ['type:bug']
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you see, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the demo
        2. ...
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Chrome 141
  - type: textarea
    id: extra
    attributes:
      label: Screenshots, a sample event (JSON) or console output
